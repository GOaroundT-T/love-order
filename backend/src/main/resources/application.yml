server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/love_order}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:9000,http://localhost:5173,http://127.0.0.1:9000}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.stdout.StdOutImpl}
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: ${KNIFE4J_ENABLE:true}
  openapi:
    title: 情侣私房菜点餐 API
    version: 1.0.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.love.order.controller

sa-token:
  token-name: satoken
  timeout: ${SA_TOKEN_TIMEOUT:2592000}
  active-timeout: -1
  token-style: uuid
  is-share: false
  is-log: ${SA_TOKEN_LOG:true}
