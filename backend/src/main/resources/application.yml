server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/love_order
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  openapi:
    title: 情侣私房菜点餐 API
    version: 1.0.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.love.order.controller

sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: -1
  token-style: uuid
  is-share: false
  is-log: true
